[project]
name = "list-gen-benchmarking"
version = "0.1.0"
description = "Benchmark LLM company-list generation with and without the akta.pro MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "json-repair>=0.30.0",
    "mcp>=2.1.1",
    "openrouter>=1.1.127",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "simplejson>=4.1.2",
    "tldextract>=5.3.2",
]

[dependency-groups]
dev = [
    "types-simplejson>=4.1.0.20260724",
]
