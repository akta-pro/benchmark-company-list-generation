# Each query runs once per variant; a variant only sets the tool flags.
# fact_questions build each company's fact pack ({{company_name}} and
# {{website}} are filled in), which the judge in config/validation/ reads.
queries:
  - id: bootstrapped_hvac
    text: >
      Find bootstrapped (founder-operated) HVAC service, maintenance & repair companies in the US with sub $10M valuation. Return a list of top 100 companies sorted based on revenue.
    structured_output: list_gen
    validation_prompt: q1.prompt.txt
    validation_schema: q1.schema.json
    variants:
      - name: web_search
        use_web_search: true
        max_web_searches: 10
      - name: akta
        use_akta: true
    fact_questions:
      - "Has this company raised venture capital? {{company_name}} ({{website}})"
      - "What services does this company provide? {{company_name}} ({{website}})"
      - "Where is this company located? {{company_name}} ({{website}})"
      - "Get information about the valuation of this company {{company_name}} ({{website}})"
      - "Get information about the revenue of this company {{company_name}} ({{website}})"

